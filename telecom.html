<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telco Tycoon Ultra: Enterprise Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Patrones para capas de cobertura */
        .bg-pattern-diagonal { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.15) 0, rgba(255,255,255,0.15) 1px, transparent 1px, transparent 8px); }
        .bg-pattern-dots { background-image: radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px); background-size: 6px 6px; }
        .bg-pattern-competitor { background-image: repeating-linear-gradient(-45deg, rgba(239,68,68,0.1) 0, rgba(239,68,68,0.1) 2px, transparent 2px, transparent 10px); }
        
        /* Animaciones suaves */
        .fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Tooltip flotante */
        #map-tooltip {
            pointer-events: none;
            transition: opacity 0.15s ease-in-out;
            z-index: 1000;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans overflow-hidden select-none">
    <div id="root" class="h-screen flex flex-col"></div>
    <div id="map-tooltip" class="fixed opacity-0 bg-slate-900/95 backdrop-blur-sm border border-slate-600 p-3 rounded-xl shadow-2xl text-xs flex flex-col gap-1 w-48 shadow-[0_10px_40px_rgba(0,0,0,0.5)]"></div>

    <script>
        // --- CONSTANTES Y CONFIGURACIÓN ---
        const GRID_SIZE = 24; 
        const BASE_TICK_RATE = 10000; // 10.0s = 1 mes (Velocidad 1x)

        const INFRA_TYPES = {
            TOWER_4G: { id: 'TOWER_4G', name: 'Torre 4G/LTE', type: 'mobile', tech: 2, range: 4, cost: 25000, rent: 500, power: 150, maint: 100, cap: 1000, icon: 'radio-tower', color: 'text-blue-500' },
            TOWER_5G: { id: 'TOWER_5G', name: 'Antena 5G', type: 'mobile', tech: 3, range: 2, cost: 75000, rent: 1200, power: 500, maint: 250, cap: 4000, icon: 'radio-tower', color: 'text-purple-400' },
            RADIO_LINK: { id: 'RADIO_LINK', name: 'Radioenlace', type: 'backhaul', tech: 2, range: 6, cost: 15000, rent: 200, power: 100, maint: 50, cap: 800, icon: 'wifi', color: 'text-cyan-400' },
            NODE_ADSL: { id: 'NODE_ADSL', name: 'Centralita ADSL', type: 'fixed', tech: 1, range: 2, cost: 15000, rent: 100, power: 50, maint: 50, cap: 500, icon: 'router', color: 'text-orange-400' },
            NODE_FIBER: { id: 'NODE_FIBER', name: 'Nodo FTTH', type: 'fixed', tech: 3, range: 3, cost: 55000, rent: 300, power: 200, maint: 150, cap: 5000, icon: 'network', color: 'text-emerald-400' },
            FIBER_TRUNK: { id: 'FIBER_TRUNK', name: 'Cableado Troncal', type: 'backhaul', tech: 3, range: 1, cost: 20000, rent: 50, power: 10, maint: 20, cap: 3000, icon: 'cable', color: 'text-slate-300' },
            CENTRAL_OFFICE: { id: 'CENTRAL_OFFICE', name: 'Central Telefónica', type: 'core', tech: 2, range: 8, cost: 150000, rent: 1500, power: 800, maint: 600, cap: 15000, icon: 'building-2', color: 'text-gray-400' },
            DATA_CENTER: { id: 'DATA_CENTER', name: 'Centro de Datos', type: 'core', tech: 3, range: 12, cost: 500000, rent: 5000, power: 2500, maint: 1500, cap: 50000, icon: 'database', color: 'text-indigo-400' },
            COMMERCIAL_OFFICE: { id: 'COMMERCIAL_OFFICE', name: 'Oficina Comercial', type: 'commercial', tech: 0, range: 3, cost: 120000, rent: 3000, power: 200, maint: 500, cap: 0, icon: 'store', color: 'text-yellow-400' }
        };

        const ZONES = [
            { id: 0, name: 'Distrito Norte', bounds: { minX: 0, maxX: 11, minY: 0, maxY: 11 }, color: 'border-t-4 border-l-4 border-blue-900/50', bg: 'bg-blue-950/20' },
            { id: 1, name: 'Distrito Este', bounds: { minX: 12, maxX: 23, minY: 0, maxY: 11 }, color: 'border-t-4 border-r-4 border-indigo-900/50', bg: 'bg-indigo-950/20' },
            { id: 2, name: 'Distrito Sur', bounds: { minX: 0, maxX: 11, minY: 12, maxY: 23 }, color: 'border-b-4 border-l-4 border-emerald-900/50', bg: 'bg-emerald-950/20' },
            { id: 3, name: 'Distrito Oeste', bounds: { minX: 12, maxX: 23, minY: 12, maxY: 23 }, color: 'border-b-4 border-r-4 border-purple-900/50', bg: 'bg-purple-950/20' }
        ];

        const COMP_TEMPLATES = [
            { id: 'c1', name: 'MegaCom (Monopolio)', color: 'text-red-500', bg: 'bg-red-500', style: 'aggressive' },
            { id: 'c2', name: 'PremiumNet (Premium)', color: 'text-purple-500', bg: 'bg-purple-500', style: 'premium' },
            { id: 'c3', name: 'NovaLocal (Startup)', color: 'text-emerald-500', bg: 'bg-emerald-500', style: 'startup' }
        ];

        const CONTRACT_TIERS = {
            SLA_99: { id: 'SLA_99', name: 'Básico (SLA 99%)', reqTech: 2, baseValue: 2500, fine: 1000, desc: 'Requiere 4G o ADSL.' },
            SLA_999: { id: 'SLA_999', name: 'Premium (SLA 99.9%)', reqTech: 3, baseValue: 6000, fine: 5000, desc: 'Requiere 5G o Fibra.' },
            SLA_9999: { id: 'SLA_9999', name: 'Crítico (SLA 99.99%)', reqTech: 3, baseValue: 18000, fine: 20000, desc: 'Redundancia Móvil Lvl 3 + Fijo Lvl 3.' }
        };

        const SERVICE_COSTS = { voice: 1.5, sms: 0.5, data: 3.0, roaming: 5.0, internet: 6.0, tv: 15.0, streaming: 8.0, sat_internet: 12.0, sat_tv: 10.0 };
        
        const IT_SERVICES = {
            hosting: { id: 'hosting', name: 'Web Hosting Corporativo', costToUnlock: 150000, revenuePerB2B: 400, reqTech: 3 },
            cdn: { id: 'cdn', name: 'Red de Distribución (CDN)', costToUnlock: 350000, revenuePerB2B: 900, reqTech: 3 },
            cloud: { id: 'cloud', name: 'Cloud Computing & IA', costToUnlock: 800000, revenuePerB2B: 2500, reqTech: 3 },
            tv_rights: { id: 'tv_rights', name: 'Licencia TV Satelital', costToUnlock: 500000, revenuePerB2B: 0, reqTech: 0, type: 'content' },
            stream_rights: { id: 'stream_rights', name: 'Licencia Streaming VOD', costToUnlock: 300000, revenuePerB2B: 0, reqTech: 0, type: 'content' }
        };

        // --- GENERACIÓN DEL MAPA INTELIGENTE ---
        const generateMap = () => {
            const newMap = [];
            const townhalls = [ {x: 6, y: 6}, {x: 18, y: 8}, {x: 9, y: 19} ];

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const zoneId = (x < 12 ? 0 : 1) + (y < 12 ? 0 : 2);
                    let type = 'empty'; let pop = 0; let isTownhall = false; let isBusiness = false; let isSchool = false;
                    let terrain = 'plain';
                    let wealth = 2; // 1: Bajo, 2: Medio, 3: Alto
                    
                    // Generación Geográfica
                    if (x >= 21 + Math.sin(y)*1.5) {
                        terrain = 'sea';
                    } else if (Math.abs(x - (12 + Math.sin(y/1.5)*2)) <= 1) {
                        terrain = 'river';
                    } else if ((Math.pow(x-3, 2) + Math.pow(y-19, 2) < 16) || (Math.pow(x-18, 2) + Math.pow(y-3, 2) < 12)) {
                        terrain = 'mountain';
                    }

                    const minDist = Math.min(...townhalls.map(th => Math.sqrt(Math.pow(th.x - x, 2) + Math.pow(th.y - y, 2))));
                    const urbFactor = Math.max(0, 1 - (minDist / 7)); 
                    const rand = Math.random() + (urbFactor * 0.6); 

                    if (terrain !== 'sea' && terrain !== 'river') {
                        if (townhalls.some(th => th.x === x && th.y === y)) {
                            type = 'townhall'; isTownhall = true; pop = 0; wealth = 3;
                        } else if (rand > 1.3) {
                            type = 'business'; isBusiness = true; pop = Math.floor(Math.random() * 300) + 100; wealth = 3;
                        } else if (rand > 1.20) {
                            type = 'school'; isSchool = true; pop = Math.floor(Math.random() * 600) + 200; wealth = 2;
                        } else if (rand > 0.9) {
                            type = 'building'; pop = Math.floor(Math.random() * 120) + 40; wealth = Math.random() > 0.5 ? 2 : 3;
                        } else if (rand > 0.5) {
                            type = 'house'; pop = Math.floor(Math.random() * 15) + 2; wealth = Math.random() > 0.7 ? 2 : 1;
                        }
                    }

                    // Contratos preexistentes de la competencia
                    let compContract = null;
                    if (isTownhall || isBusiness || isSchool) {
                        const comp = COMP_TEMPLATES[Math.floor(Math.random() * COMP_TEMPLATES.length)];
                        const tier = isSchool ? 'SLA_99' : (Math.random() > 0.5 ? 'SLA_999' : 'SLA_99');
                        const basePrice = CONTRACT_TIERS[tier].baseValue;
                        compContract = { compId: comp.id, compName: comp.name, tierId: tier, price: basePrice * (0.8 + Math.random()*0.4) };
                    }

                    newMap.push({ id: `${x}-${y}`, x, y, type, pop, isTownhall, isBusiness, isSchool, zoneId, planId: null, compContract, terrain, wealth });
                }
            }
            return newMap;
        };

        const generateCompetitors = () => {
            return COMP_TEMPLATES.map(t => ({
                ...t,
                relation: 50,
                sharesOwned: 0,
                activeOffers: {},
                valuation: 3000000 + Math.floor(Math.random() * 5000000),
                plans: [{ name: 'Plan Estándar', price: 30 + Math.random() * 20 }],
                licenses: ZONES.filter(() => Math.random() > 0.3).map(z => z.id) // Tienen licencias en zonas aleatorias
            }));
        };

        // --- ESTADO GLOBAL ---
        let state = {
            month: 1, 
            speed: 1, 
            isPaused: false,
            money: 50000000, 
            mapData: generateMap(), 
            competitors: generateCompetitors(),
            infra: [],
            isSpectator: false,
            spectatorBank: 0,
            settings: { competitionEnabled: true, smsAdsEnabled: false },
            municipalities: ZONES.map(z => ({
                id: z.id, name: z.name, hasSpectrum: false, spectrumCost: 150000 + Math.floor(Math.random() * 50000),
                mayorRespect: 30 + Math.floor(Math.random() * 50),
                compShare: 40 + Math.floor(Math.random() * 30),
                subsidiaryActive: false
            })),
            plans: [
                { id: 'p1', name: 'Prepago Básico', type: 'mobile', zoneId: 'all', price: 15, services: { voice: true, sms: true, data: false, roaming: false }, minTech: 1 },
                { id: 'p2', name: 'Fibra Hogar 300Mb', type: 'fixed', zoneId: 'all', price: 40, services: { internet: true }, minTech: 3 },
            ],
            contracts: [],
            satellites: [],
            satelliteContracts: [],
            satelliteOffers: [],
            tenders: [],
            legal: { nationalLicense: false, dataProtection: false, taxRate: 0.20 },
            itServices: { hosting: false, cdn: false, cloud: false },
            contentLicenses: { tv: false, streaming: false },
            wholesale: { agreements: [] }, 
            transportAds: [], 
            corporate: {
                sharesOwned: 0, 
                equityOwned: 100, 
                marketIndexPrice: 100,
                companyValuation: 500000,
                loan: 0
            },
            hr: { 
                technicians: { count: 5, salary: 1200, prod: 100, base: 1200 }, 
                support: { count: 5, salary: 900, prod: 100, base: 900 }, 
                engineers: { count: 2, salary: 2800, prod: 100, base: 2800 } 
            },
            noc: {
                ping: 15,
                loads: { 0: 0, 1: 0, 2: 0, 3: 0 },
                capacities: { 0: 2000, 1: 2000, 2: 2000, 3: 2000 },
                backbone: {
                    0: { cap: 2000, level: 1 },
                    1: { cap: 2000, level: 1 },
                    2: { cap: 2000, level: 1 },
                    3: { cap: 2000, level: 1 }
                }
            },
            finances: { 
                current: { incomePlans: 0, incomeContracts: 0, incomeIT: 0, incomeAds: 0, incomeWholesale: 0, incomeSpace: 0, incomeFinancial: 0, incomeGrants: 0, varCosts: 0, costWholesale: 0, rent: 0, power: 0, maint: 0, fines: 0, legalFines: 0, taxes: 0, capEx: 0, salaries: 0, interest: 0, net: 0 },
                history: [], 
                planPerformance: {} 
            },
            logs: [{month: 1, msg: 'Compañía fundada. Esperando despliegue de red...', type: 'info'}],
            activeEvent: null,
            gameOver: false
        };

        let uiState = {
            mobileView: 'map', zoom: 1, activeTab: 'dashboard', selectedTool: null, selectedCell: null, showCoverageMode: null,
            newPlan: { name: '', type: 'mobile', zoneId: 'all', price: 25, minTech: 1, sVoice: true, sSms: true, sData: true, sRoaming: false, sInt: true, sTv: false, sStream: false, sSatInt: false, sSatTv: false },
            contractForm: { tierId: 'SLA_99', askingPrice: 2000 }, showBuyoutModal: false, buyoutOffer: null,
            notification: null
        };

        let gameInterval = null;
        let pendingRender = false; // Control de re-renderizado para no interrumpir el teclado

        // Selectores Derivados
        let totalPop = 0; let connectedPop = 0; let arpu = 0; let fiberB2BClients = 0;
        const getCompetitor = (id) => state.competitors.find(c => c.id === id);

        // --- REDUCER ---
        function gameReducer(currentState, action) {
            if (currentState.gameOver) return currentState;
            const addLog = (msg, type = 'info') => ({ month: currentState.month, msg, type });

            switch (action.type) {
                case 'SET_SPEED':
                    return { ...currentState, speed: action.payload, isPaused: false };
                
                case 'TOGGLE_PAUSE':
                    return { ...currentState, isPaused: !currentState.isPaused };

                case 'BUILD_INFRA': {
                    if (currentState.isSpectator) return currentState;
                    const { x, y, infraType } = action.payload;
                    const template = INFRA_TYPES[infraType];
                    const cell = currentState.mapData.find(c => c.x === x && c.y === y);
                    const zoneId = cell.zoneId;
                    const zone = currentState.municipalities.find(z => z.id === zoneId);
                    
                    if (template.type === 'mobile' && !zone.hasSpectrum) return { ...currentState, logs: [addLog(`[RECHAZADO] Sin licencia de espectro en ${zone.name}.`, 'error'), ...currentState.logs] };
                    if (template.type === 'core' && !currentState.legal.nationalLicense) return { ...currentState, logs: [addLog(`[RECHAZADO] Requiere Licencia Nacional para infra Core.`, 'error'), ...currentState.logs] };
                    if (currentState.infra.some(i => i.x === x && i.y === y)) return currentState;
                    
                    const terrainMultipliers = { plain: 1, mountain: 2.5, river: 1.5, sea: 5 };
                    let finalCost = template.cost * terrainMultipliers[cell.terrain];

                    if (currentState.money < finalCost) return { ...currentState, logs: [addLog(`Fondos insuficientes para ${template.name} (${formatCur(finalCost)})`, 'error'), ...currentState.logs] };

                    let logMsg = `Construcción: ${template.name} en [${x},${y}]`;
                    if (cell.terrain !== 'plain') logMsg += ` (Terreno: ${cell.terrain.toUpperCase()}, Coste x${terrainMultipliers[cell.terrain]})`;

                    if (zone.mayorRespect < 35 && !zone.subsidiaryActive) {
                        finalCost *= 1.35;
                        logMsg += ` (+35% sobrecosto por trabas burocráticas)`;
                    }

                    // --- GUERRA DE PRECIOS ---
                    let newCompsForInfra = currentState.competitors.map(c => {
                        if (c.licenses.includes(zoneId) && c.sharesOwned < 51 && zone.compShare > 20) {
                            if (c.style === 'aggressive' || c.style === 'startup') {
                                if (!c.activeOffers) c.activeOffers = {};
                                if (!c.activeOffers[zoneId]) {
                                    c.activeOffers[zoneId] = 3; // 3 meses de oferta
                                    logMsg += ` | ¡GUERRA DE PRECIOS! ${c.name} regala 3 meses gratis.`;
                                }
                            }
                        }
                        return c;
                    });

                    return { 
                        ...currentState, money: currentState.money - finalCost, 
                        competitors: newCompsForInfra,
                        infra: [...currentState.infra, { id: Date.now().toString(), x, y, type: infraType, zoneId }],
                        finances: { ...currentState.finances, current: { ...currentState.finances.current, capEx: currentState.finances.current.capEx + finalCost } },
                        logs: [addLog(logMsg, 'success'), ...currentState.logs]
                    };
                }

                case 'HIRE_EMP': {
                    const role = action.payload;
                    const cost = currentState.hr[role].salary;
                    if (currentState.money < cost) return { ...currentState, logs: [addLog('Fondos insuficientes para contratación.', 'error'), ...currentState.logs] };
                    return { ...currentState, money: currentState.money - cost, hr: { ...currentState.hr, [role]: { ...currentState.hr[role], count: currentState.hr[role].count + 1 } }, logs: [addLog(`Empleado contratado.`, 'info'), ...currentState.logs] };
                }

                case 'FIRE_EMP': {
                    const role = action.payload;
                    if (currentState.hr[role].count <= 0) return currentState;
                    return { ...currentState, hr: { ...currentState.hr, [role]: { ...currentState.hr[role], count: currentState.hr[role].count - 1 } }, logs: [addLog(`Empleado despedido.`, 'warning'), ...currentState.logs] };
                }

                case 'ADJUST_SALARY': {
                    if (currentState.isSpectator) return currentState;
                    const { role, amount } = action.payload;
                    const emp = currentState.hr[role];
                    const newSalary = Math.max(emp.base * 0.5, emp.salary + amount); // Min 50% del base
                    const newProd = Math.floor((newSalary / emp.base) * 100);
                    return { ...currentState, hr: { ...currentState.hr, [role]: { ...emp, salary: newSalary, prod: newProd } } };
                }

                case 'TAKE_LOAN': {
                    return { ...currentState, money: currentState.money + action.payload, corporate: { ...currentState.corporate, loan: currentState.corporate.loan + action.payload }, logs: [addLog(`Préstamo adquirido por ${formatCur(action.payload)}.`, 'warning'), ...currentState.logs] };
                }

                case 'REPAY_LOAN': {
                    if (currentState.corporate.loan <= 0) return currentState;
                    const amount = Math.min(currentState.money, Math.min(action.payload, currentState.corporate.loan));
                    if (amount <= 0) return currentState;
                    return { ...currentState, money: currentState.money - amount, corporate: { ...currentState.corporate, loan: currentState.corporate.loan - amount }, logs: [addLog(`Deuda pagada por ${formatCur(amount)}.`, 'success'), ...currentState.logs] };
                }

                case 'REMOVE_INFRA': {
                    if (currentState.isSpectator) return currentState;
                    const { x, y } = action.payload;
                    const infraIndex = currentState.infra.findIndex(i => i.x === x && i.y === y);
                    
                    if (infraIndex === -1) return currentState; 
                    if (currentState.infra[infraIndex].owner) return { ...currentState, logs: [addLog('No puedes demoler infraestructura de la competencia.', 'error'), ...currentState.logs] };

                    const newInfra = [...currentState.infra];
                    newInfra.splice(infraIndex, 1);
                    
                    const cost = 500;
                    if (currentState.money < cost) return { ...currentState, logs: [addLog('Fondos insuficientes para demolición ($500).', 'error'), ...currentState.logs] };

                    return {
                        ...currentState, money: currentState.money - cost, infra: newInfra,
                        logs: [addLog(`Infraestructura demolida en [${x},${y}].`, 'warning'), ...currentState.logs]
                    };
                }
                
                case 'BUY_SPECTRUM': {
                    if (currentState.isSpectator) return currentState;
                    const zone = currentState.municipalities.find(z => z.id === action.payload);
                    if (currentState.money < zone.spectrumCost || zone.hasSpectrum) return currentState;
                    const newMuns = currentState.municipalities.map(m => m.id === action.payload ? { ...m, hasSpectrum: true } : m);
                    return { ...currentState, money: currentState.money - zone.spectrumCost, municipalities: newMuns, logs: [addLog(`Espectro adquirido en ${zone.name}.`, 'success'), ...currentState.logs] };
                }

                case 'LOBBY_MAYOR': {
                    if (currentState.isSpectator) return currentState;
                    const zone = currentState.municipalities.find(z => z.id === action.payload);
                    if (currentState.money < 50000) return currentState;
                    const newMuns = currentState.municipalities.map(m => m.id === action.payload ? { ...m, mayorRespect: Math.min(100, m.mayorRespect + 50) } : m);
                    return { ...currentState, money: currentState.money - 50000, municipalities: newMuns, logs: [addLog(`Cabildeo exitoso en ${zone.name}.`, 'info'), ...currentState.logs] };
                }

                case 'CREATE_SUBSIDIARY': {
                    const zone = currentState.municipalities.find(z => z.id === action.payload);
                    if (currentState.money < 250000 || zone.subsidiaryActive) return currentState;
                    const newMuns = currentState.municipalities.map(m => m.id === action.payload ? { ...m, subsidiaryActive: true, mayorRespect: 80 } : m);
                    return { ...currentState, money: currentState.money - 250000, municipalities: newMuns, logs: [addLog(`Filial regional creada en ${zone.name}. Reputación municipal reseteada.`, 'success'), ...currentState.logs] };
                }

                case 'BUY_NATIONAL_LICENSE': {
                    if (currentState.money < 500000 || currentState.legal.nationalLicense) return currentState;
                    return { ...currentState, money: currentState.money - 500000, legal: { ...currentState.legal, nationalLicense: true }, logs: [addLog('Licencia Nacional de Operador adquirida. Ya puedes construir Core.', 'success'), ...currentState.logs] };
                }

                case 'TOGGLE_DATA_PROTECTION': {
                    const newState = !currentState.legal.dataProtection;
                    return {
                        ...currentState,
                        legal: { ...currentState.legal, dataProtection: newState },
                        settings: { ...currentState.settings, smsAdsEnabled: newState ? false : currentState.settings.smsAdsEnabled },
                        logs: [addLog(`Protección de Datos ${newState ? 'Activada (Bloquea Venta Ads)' : 'Desactivada'}.`, 'info'), ...currentState.logs]
                    };
                }

                case 'BUY_IT_SERVICE': {
                    const svc = IT_SERVICES[action.payload];
                    if (currentState.money < svc.costToUnlock) return currentState;
                    
                    if (svc.type === 'content') {
                        if (currentState.contentLicenses[action.payload === 'tv_rights' ? 'tv' : 'streaming']) return currentState;
                        return {
                            ...currentState, money: currentState.money - svc.costToUnlock,
                            contentLicenses: { ...currentState.contentLicenses, [action.payload === 'tv_rights' ? 'tv' : 'streaming']: true },
                            logs: [addLog(`Licencia Adquirida: ${svc.name}.`, 'success'), ...currentState.logs]
                        };
                    } else {
                        if (currentState.itServices[action.payload]) return currentState;
                        return { 
                            ...currentState, money: currentState.money - svc.costToUnlock, 
                            itServices: { ...currentState.itServices, [action.payload]: true },
                            logs: [addLog(`Servicio B2B Desbloqueado: ${svc.name}.`, 'success'), ...currentState.logs]
                        };
                    }
                }

                case 'TOGGLE_WHOLESALE': {
                    const { compId, type } = action.payload; 
                    const comp = currentState.competitors.find(c => c.id === compId);
                    const exists = currentState.wholesale.agreements.find(a => a.compId === compId && a.type === type);
                    
                    if (exists) {
                        return {
                            ...currentState,
                            wholesale: { agreements: currentState.wholesale.agreements.filter(a => !(a.compId === compId && a.type === type)) },
                            logs: [addLog(`Acuerdo mayorista cancelado con ${comp.name}.`, 'info'), ...currentState.logs]
                        };
                    } else {
                        if (comp.relation < 30) {

                    return { ...currentState, money: newMoney, competitors: newComps, infra: newInfra, contracts: newContracts, mapData: newMapData, logs: [addLog(log, 'success'), ...currentState.logs] };

                case 'NEGOTIATE_CONTRACT': {

                    if (cell.compContract) {
                        if (askingPrice < cell.compContract.price) successChance += 40; 
                        else if (askingPrice > cell.compContract.price) successChance -= 60; 
                        if (tierId !== cell.compContract.tierId) successChance -= 20; 
                    } else {
                        const priceRatio = askingPrice / tier.baseValue; 
                        successChance -= (priceRatio - 1) * 100;
                    }

                    if (cell.isTownhall) successChance += (zone.mayorRespect - 50); 
                    successChance = Math.max(5, Math.min(95, successChance));
                    
                    if (Math.random() * 100 <= successChance) {

                        return { 
                            ...currentState, mapData: newMap,

                case 'TOGGLE_SETTING': {

                case 'DELETE_PLAN': {

                        mapData: currentState.mapData.map(c => ({...c, planId: null, compContract: c.compContract || (c.isBusiness||c.isSchool||c.isTownhall ? { compName:'MegaCom (Adquiriente)', price: 5000, tierId: 'SLA_999' } : null)})),
                        logs: [addLog(`¡EMPRESA VENDIDA! Has recibido ${formatCur(action.payload)}. Ahora eres un magnate inversor.`, 'success'), ...currentState.logs]

                        legal: { nationalLicense: false, dataProtection: false, taxRate: 0.20 },

                case 'CANCEL_FAILING_CONTRACTS': {
                    // Cálculo rápido de cobertura para validar
                    const cov = {};
                    currentState.mapData.forEach(c => cov[c.id] = { m: 0, f: 0 });
                    currentState.infra.forEach(i => {
                        if (i.owner) return;
                        const t = INFRA_TYPES[i.type];
                        for (let dy = -t.range; dy <= t.range; dy++) {
                            for (let dx = -t.range; dx <= t.range; dx++) {
                                const cx = i.x + dx; const cy = i.y + dy;
                                if (cx >= 0 && cx < GRID_SIZE && cy >= 0 && cy < GRID_SIZE) {
                                    if (Math.sqrt(dx*dx + dy*dy) <= t.range) {
                                        const id = `${cx}-${cy}`;
                                        if (t.type === 'mobile' && t.tech > cov[id].m) cov[id].m = t.tech;
                                        if (t.type === 'fixed' && t.tech > cov[id].f) cov[id].f = t.tech;
                                    }
                                }
                            }
                        }
                    });

                    const failingContracts = currentState.contracts.filter(c => {
                        const cellCov = cov[c.id];
                        const tier = CONTRACT_TIERS[c.tierId];
                        if (tier.id === 'SLA_9999') return !(cellCov.m >= 3 && cellCov.f >= 3);
                        return !(cellCov.m >= tier.reqTech || cellCov.f >= tier.reqTech);
                    });

                    if (failingContracts.length === 0) return { ...currentState, logs: [addLog('No hay contratos con multas para cancelar.', 'info'), ...currentState.logs] };
                    const failingIds = failingContracts.map(c => c.id);
                    return { ...currentState, contracts: currentState.contracts.filter(c => !failingIds.includes(c.id)), logs: [addLog(`Cancelados ${failingContracts.length} contratos que generaban multas.`, 'success'), ...currentState.logs] };
                }

                case 'UPGRADE_BACKBONE': {

                    return {
                        ...currentState,
                        money: currentState.money - cost,

                        finances: { ...currentState.finances, current: { ...currentState.finances.current, capEx: currentState.finances.current.capEx + cost } },
                        logs: [addLog(`Backbone ampliado en Zona ${zoneId} (+5000 Tbps).`, 'success'), ...currentState.logs]
                    };
                }

                case 'BUY_TRANSIT_PORT': {
                    if (currentState.isSpectator || currentState.money < 50000) return currentState;
                    return { ...currentState, money: currentState.money - 50000, noc: { ...currentState.noc, transit: { ...currentState.noc.transit, ports: currentState.noc.transit.ports + 1 } }, logs: [addLog('Puerto de Tránsito IP (10k Tbps) añadido.', 'success'), ...currentState.logs] };
                }

                case 'SETUP_PEERING': {
                    if (currentState.isSpectator || currentState.money < action.payload.cost || !currentState.noc.global.ixp || currentState.noc.peering[action.payload.type]) return currentState;
                    return { ...currentState, money: currentState.money - action.payload.cost, noc: { ...currentState.noc, peering: { ...currentState.noc.peering, [action.payload.type]: true } }, logs: [addLog(`Acuerdo de Peering ${action.payload.type === 'cdn' ? 'Directo CDN/Cloud' : 'Público'} establecido.`, 'success'), ...currentState.logs] };
                }

                case 'SET_BGP_POLICY': {
                    if (currentState.isSpectator) return currentState;
                    return { ...currentState, noc: { ...currentState.noc, bgp: { ...currentState.noc.bgp, policy: action.payload } }, logs: [addLog(`Política BGP cambiada a: ${action.payload}.`, 'info'), ...currentState.logs] };
                }

                case 'TICK': {
                    let fin = { incomePlans: 0, incomeContracts: 0, incomeIT: 0, incomeAds: 0, incomeWholesale: 0, incomeSpace: 0, incomeFinancial: 0, incomeGrants: 0, varCosts: 0, costWholesale: 0, rent: 0, power: 0, maint: 0, fines: 0, legalFines: 0, taxes: 0, capEx: 0, salaries: 0, interest: 0, net: 0 };
                    let planPerf = {}; currentState.plans.forEach(p => planPerf[p.id] = { subs: 0, revenue: 0, opEx: 0, churn: 0 });
                    let newLogs = [];
                    let newLoads = { 0: 0, 1: 0, 2: 0, 3: 0 };

                    let newInfra = [...currentState.infra];

                    // --- EVENTOS NOC ---
                    let currentEvent = currentState.activeEvent ? { ...currentState.activeEvent } : null;
                    if (!currentEvent && Math.random() < 0.05) {
                        const EVENTS = [
                            { type: 'fiber_cut', name: 'Corte Troncal', desc: 'Una retroexcavadora cortó una fibra en la calle.', duration: 2 },
                            { type: 'ddos', name: 'Ataque DDoS', desc: 'Tráfico basura satura los nodos B2B principales.', duration: 2 },
                            { type: 'solar_storm', name: 'Tormenta Solar', desc: 'Interferencia electromagnética bloquea satélites.', duration: 3 },
                            { type: 'gaming_patch', name: 'Pico de Tráfico', desc: 'Un parche masivo de un videojuego satura la red.', duration: 1 },
                            { type: 'hurricane', name: 'Huracán', desc: 'Vientos huracanados destruyen antenas y torres.', duration: 1 },
                            { type: 'earthquake', name: 'Terremoto', desc: 'Movimiento sísmico daña infraestructura terrestre y nodos.', duration: 1 }
                        ];
                        currentEvent = { ...EVENTS[Math.floor(Math.random() * EVENTS.length)] };
                        newLogs.push(addLog(`¡INCIDENCIA NOC! ${currentEvent.name}: ${currentEvent.desc}`, 'warning'));

                        if (currentEvent.type === 'hurricane' || currentEvent.type === 'earthquake') {
                            let destroyedCount = 0;
                            newInfra = newInfra.filter(i => {
                                const t = INFRA_TYPES[i.type];
                                let chance = 0.02; // Probabilidad base de destrucción general
                                if (currentEvent.type === 'hurricane' && t.type === 'mobile') chance = 0.15; // 15% de destruir torres
                                else if (currentEvent.type === 'earthquake' && (t.type === 'fixed' || t.type === 'core' || t.type === 'backhaul')) chance = 0.15; // 15% de destruir nodos fijos/core
                                
                                if (Math.random() < chance) {
                                    if (!i.owner) destroyedCount++;
                                    return false; // Se elimina del mapa
                                }
                                return true;
                            });
                            if (destroyedCount > 0) {
                                newLogs.push(addLog(`¡Desastre natural! Has perdido ${destroyedCount} instalaciones en el evento.`, 'error'));
                            }
                        }
                    } else if (currentEvent) {
                        currentEvent.duration -= 1;
                        if (currentEvent.duration <= 0) {
                            newLogs.push(addLog(`Incidencia resuelta: ${currentEvent.name}.`, 'success'));
                            currentEvent = null;
                        }
                    }

                    // --- IA COMPETENCIA AVANZADA ---
                    let newComps = currentState.competitors.map(comp => {
                        let updatedOffers = { ...(comp.activeOffers || {}) };
                        for (let z in updatedOffers) {
                            if (updatedOffers[z] > 0) updatedOffers[z]--;
                            if (updatedOffers[z] <= 0) delete updatedOffers[z];
                        }
                        return { ...comp, activeOffers: updatedOffers };
                    });

                    if (state.settings.competitionEnabled && currentState.month % 3 === 0) {
                        newComps.forEach(comp => {
                            if (comp.sharesOwned >= 51) return; // M&A: Si los controlas, no se expanden solos agresivamente
                            if (comp.licenses.length > 0 && Math.random() > (comp.style === 'startup' ? 0.2 : 0.4)) {
                                const targetZoneId = comp.licenses[Math.floor(Math.random() * comp.licenses.length)];
                                const candidates = currentState.mapData.filter(c => c.zoneId === targetZoneId && c.pop > 10 && !newInfra.some(i => i.x === c.x && i.y === c.y));
                                
                                if (candidates.length > 0) {
                                    candidates.sort((a,b) => b.pop - a.pop); // Ordenar por población descendente
                                    const target = candidates[0]; // Tomar la mejor parcela
                                    let type = 'TOWER_4G';
                                    if (comp.style === 'premium') type = Math.random() > 0.5 ? 'NODE_FIBER' : 'TOWER_5G';
                                    else if (comp.style === 'aggressive') type = Math.random() > 0.6 ? 'TOWER_5G' : 'TOWER_4G';
                                    else if (comp.style === 'startup') type = Math.random() > 0.5 ? 'NODE_ADSL' : 'RADIO_LINK';
                                    
                                    newInfra.push({
                                        id: `comp_${comp.id}_${Date.now()}`,
                                        x: target.x, y: target.y, type: type, zoneId: targetZoneId, owner: comp.id
                                    });
                                }
                            }
                        });
                    }

                    let currentMarketPrice = currentState.corporate.marketIndexPrice;
                    currentMarketPrice += (Math.random() * 10 - 4.5);
                    currentMarketPrice = Math.max(10, currentMarketPrice);

                    if (currentState.isSpectator) {
                        return { ...currentState, month: currentState.month + 1, infra: newInfra, corporate: { ...currentState.corporate, marketIndexPrice: currentMarketPrice }, logs: [...newLogs, ...currentState.logs].slice(0, 50) };
                    }

                    // 1. Calcular Cobertura e Influencia Comercial
                    const coverageMap = {}; 
                    let commercialBoosts = {}; 
                    const activeAds = currentState.transportAds.map(ad => ({...ad, monthsLeft: ad.monthsLeft - 1})).filter(ad => ad.monthsLeft > 0);

                    currentState.mapData.forEach(c => coverageMap[c.id] = { mobile: 0, fixed: 0, owner: null });
                    
                    newInfra.forEach(i => {
                        const t = INFRA_TYPES[i.type];
                        if (!i.owner) { 
                            fin.rent += t.rent; fin.power += t.power; fin.maint += t.maint;
                        }

                        for (let dy = -t.range; dy <= t.range; dy++) {
                            for (let dx = -t.range; dx <= t.range; dx++) {
                                const cx = i.x + dx; const cy = i.y + dy;
                                if (cx >= 0 && cx < GRID_SIZE && cy >= 0 && cy < GRID_SIZE) {
                                    if (Math.sqrt(dx*dx + dy*dy) <= t.range) {
                                        const cellId = `${cx}-${cy}`;
                                        if (!i.owner) { 
                                            if (t.type === 'mobile' && t.tech > coverageMap[cellId].mobile) coverageMap[cellId].mobile = t.tech;
                                            if (t.type === 'fixed' && t.tech > coverageMap[cellId].fixed) coverageMap[cellId].fixed = t.tech;
                                            if (t.type === 'commercial') commercialBoosts[cellId] = true;
                                        }
                                    }
                                }
                            }
                        }
                    });

                    // 2. Crecimiento Dinámico de la Ciudad
                    let newMapData = [...currentState.mapData];
                    if (Math.random() < 0.4) {
                        const emptyCells = newMapData.filter(c => c.type === 'empty');
                        if (emptyCells.length > 0) {
                            const spawn = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                            spawn.type = 'house'; spawn.pop = Math.floor(Math.random() * 15) + 2;
                        }
                    }
                    if (Math.random() < 0.1) {
                        const houses = newMapData.filter(c => c.type === 'house');
                        if (houses.length > 0) {
                            const upgrade = houses[Math.floor(Math.random() * houses.length)];
                            upgrade.type = 'building'; upgrade.pop = Math.floor(Math.random() * 80) + 30;
                        }
                    }
                    if (currentState.month === 24 || currentState.month === 60 || currentState.month === 120) {
                        const cell = newMapData.find(c => c.type === 'empty');
                        if (cell) {
                            cell.type = currentState.month === 60 ? 'train_station' : 'bus_stop';
                            cell.pop = currentState.month === 60 ? 1500 : 300;
                            newLogs.push(addLog(`¡Nueva ${cell.type==='train_station'?'Estación de Tren':'Central de Autobuses'} inaugurada en [${cell.x},${cell.y}]!`, 'success'));
                        }
                    }
                    
                    // Procesar Satélites y Contratos Espaciales
                    let satIncome = 0;
                    let satMaint = (currentState.satellites || []).length * 25000;
                    let activeSatContracts = [];
                    (currentState.satelliteContracts || []).forEach(c => {
                        satIncome += c.amount;
                        if (c.monthsLeft > 1) activeSatContracts.push({ ...c, monthsLeft: c.monthsLeft - 1 });
                    });
                    let newSatOffers = [...(currentState.satelliteOffers || [])];
                    if (!currentState.isSpectator && Math.random() < 0.15 && currentState.satellites && currentState.satellites.length > 0) {
                        const randomSat = currentState.satellites[Math.floor(Math.random() * currentState.satellites.length)];
                        if (activeSatContracts.filter(c => c.satId === randomSat.id).length < randomSat.capacity) {
                            const compNames = ['GlobalNet Media', 'SkyLink Corp', 'Defensa Nacional', 'Agencia de Clima', 'TeleSur', 'Canal 5'];
                            const name = compNames[Math.floor(Math.random() * compNames.length)];
                            newSatOffers.push({
                                id: 'off_' + Date.now() + Math.random(), satId: randomSat.id, companyName: name,
                                amount: 25000 + Math.floor(Math.random() * 50000), duration: 12 + Math.floor(Math.random() * 24)
                            });
                            newLogs.push(addLog(`Oferta B2B: ${name} quiere alquilar capacidad en ${randomSat.name}.`, 'info'));
                        }
                    }
                    fin.incomeSpace = satIncome;
                    fin.maint += satMaint;

                    // 3. Clientes B2C
                    newMapData = newMapData.map(cell => {
                        if (cell.pop === 0 || cell.isTownhall || cell.isBusiness || cell.isSchool) return cell;

                        const myCov = coverageMap[cell.id];
                        const zone = currentState.municipalities.find(z => z.id === cell.zoneId);
                        const compShareMulti = (currentState.settings.competitionEnabled && zone.compShare > 0) ? (1 - (zone.compShare / 100)) : 1;
                        const availablePop = Math.floor(cell.pop * compShareMulti);

                        let bestPlan = null; let bestValue = 0;
                        const hasRoamingDeal = currentState.wholesale.agreements.some(a => a.type === 'rent_in');
                        
                        let isSolarStorm = currentEvent && currentEvent.type === 'solar_storm';
                        let hasSatCovAll = !isSolarStorm && currentState.satellites && currentState.satellites.some(s => s.targetZone === 'all');
                        let hasSatCovZone = !isSolarStorm && currentState.satellites && currentState.satellites.some(s => s.targetZone == cell.zoneId);
                        let hasSatCov = hasSatCovAll || hasSatCovZone;
                        let isPriceWar = newComps.some(c => c.activeOffers && c.activeOffers[cell.zoneId] > 0);

                        currentState.plans.forEach(plan => {
                            if (plan.zoneId !== 'all' && plan.zoneId !== cell.zoneId) return;
                            
                            let hasCov = false;
                            if (plan.type === 'mobile') hasCov = (myCov.mobile >= plan.minTech) || hasRoamingDeal;
                            else if (plan.type === 'fixed') hasCov = (myCov.fixed >= plan.minTech);
                            else if (plan.type === 'convergent') hasCov = ((myCov.mobile >= plan.minTech) || hasRoamingDeal) && (myCov.fixed >= plan.minTech);
                            
                            if ((plan.services?.sat_internet || plan.services?.sat_tv) && !hasSatCov) {
                                hasCov = false; 
                            }

                            if (hasCov) {
                                let value = (plan.minTech * 30); 
                                if (plan.services?.data) value += 20;
                                if (plan.services?.internet) value += 40; 
                                if (plan.services?.tv) value += 30;
                                if (plan.services?.streaming) value += 25;
                                if (plan.services?.sat_internet) { value += hasSatCovZone ? 50 : 30; if (cell.type === 'house' || cell.type === 'empty') value += 25; }
                                if (plan.services?.sat_tv) value += hasSatCovZone ? 40 : 20;

                                if (plan.type === 'convergent') value += 30; // Bonificación de valor percibido por paquete
                                if (currentState.settings.smsAdsEnabled && (plan.type === 'mobile' || plan.type === 'convergent')) value -= 35; 
                                const priceSensitivity = cell.wealth === 1 ? 2.5 : cell.wealth === 3 ? 0.8 : 1.5;
                                value -= (plan.price * priceSensitivity); 
                                
                                if (isPriceWar) value -= 50; // La guerra de precios destruye tu valor percibido
                                if (commercialBoosts[cell.id]) value += 25; 
                                
                                activeAds.forEach(ad => {
                                    const station = currentState.mapData.find(c => c.id === ad.cellId);
                                    if (station && Math.sqrt(Math.pow(station.x - cell.x, 2) + Math.pow(station.y - cell.y, 2)) <= 3) value += 40;
                                });

                                if (value > 0 && value > bestValue) { bestValue = value; bestPlan = plan; }
                            }
                        });

                        let currentPlanId = cell.planId;
                        let churnChance = commercialBoosts[cell.id] ? 0.02 : 0.08;
                        churnChance -= (currentState.hr.support.count * (currentState.hr.support.prod / 100) * 0.005); // Soporte mitiga bajas
                        if (currentState.legal.dataProtection) churnChance -= 0.03; // Mayor fidelidad
                        if (currentEvent && currentEvent.type === 'fiber_cut') churnChance += 0.05; // El corte aumenta las bajas B2C
                        if (currentState.noc.ping > 45) churnChance += 0.10; // Saturación genera bajas
                        if (isPriceWar) churnChance += 0.25; // Massive churn to competitor
                        churnChance = Math.max(0.01, churnChance);

                        if (Math.random() < churnChance) {
                            if (currentPlanId !== (bestPlan ? bestPlan.id : null)) {
                                if (currentPlanId && planPerf[currentPlanId]) planPerf[currentPlanId].churn += availablePop;
                                currentPlanId = bestPlan ? bestPlan.id : null;
                            }
                        }
                        
                        if (currentPlanId) {
                            const ap = currentState.plans.find(p => p.id === currentPlanId);
                            let retainsCov = false;
                            if (ap) {
                                if (ap.type === 'mobile') retainsCov = myCov.mobile >= ap.minTech || hasRoamingDeal;
                                else if (ap.type === 'fixed') retainsCov = myCov.fixed >= ap.minTech;
                                else if (ap.type === 'convergent') retainsCov = (myCov.mobile >= ap.minTech || hasRoamingDeal) && myCov.fixed >= ap.minTech;
                                if ((ap.services?.sat_internet || ap.services?.sat_tv) && !hasSatCov) retainsCov = false;
                            }

                            if (!ap || !retainsCov) {
                                 if (planPerf[currentPlanId]) planPerf[currentPlanId].churn += availablePop;
                                 currentPlanId = null;
                            }
                        }

                        if (currentPlanId && availablePop > 0) {
                            const p = currentState.plans.find(pl => pl.id === currentPlanId);
                            if (p) {
                                newLoads[cell.zoneId] += availablePop;
                                const rev = p.price * availablePop;
                                let vCostPerUser = 0;
                                if (p.services.voice) vCostPerUser += SERVICE_COSTS.voice;
                                if (p.services.sms) vCostPerUser += SERVICE_COSTS.sms;
                                if (p.services.data) vCostPerUser += SERVICE_COSTS.data;
                                if (p.services.roaming) vCostPerUser += SERVICE_COSTS.roaming;
                                if (p.services.internet) vCostPerUser += SERVICE_COSTS.internet;
                                if (p.services.tv) vCostPerUser += SERVICE_COSTS.tv;
                                if (p.services.streaming) vCostPerUser += SERVICE_COSTS.streaming;
                                if (p.services.sat_internet) vCostPerUser += SERVICE_COSTS.sat_internet;
                                if (p.services.sat_tv) vCostPerUser += SERVICE_COSTS.sat_tv;

                                if (currentEvent && currentEvent.type === 'gaming_patch') {
                                    vCostPerUser *= 1.5; // El pico de tráfico aumenta los costos de tránsito en un 50%
                                }
                                
                                if ((p.type === 'mobile' || p.type === 'convergent') && myCov.mobile < p.minTech && hasRoamingDeal) {
                                    fin.costWholesale += (5 * availablePop); 
                                }
                                
                                const totalVCost = vCostPerUser * availablePop;
                                fin.incomePlans += rev; fin.varCosts += totalVCost;
                                if (currentState.settings.smsAdsEnabled && (p.type === 'mobile' || p.type === 'convergent')) fin.incomeAds += 5 * availablePop;

                                if (planPerf[p.id]) {
                                    planPerf[p.id].subs += availablePop;
                                    planPerf[p.id].revenue += rev;
                                    planPerf[p.id].opEx += totalVCost;
                                }
                            }
                        }
                        return { ...cell, planId: currentPlanId };
                    });

                    // 4. Contratos B2B/B2G e IT Services
                    let contractsToDrop = [];
                    let localFiberB2BClients = 0;

                    // Pre-calculo de cargas B2B, Capacidades de Red y Ping (NOC)
                    let zoneCapacities = { 0: 0, 1: 0, 2: 0, 3: 0 };
                    for (let z in currentState.noc.backbone) {
                        zoneCapacities[z] += currentState.noc.backbone[z].cap;
                    }
                    let dcCount = 0;
                    newInfra.forEach(i => {
                        if (i.owner) return;
                        const t = INFRA_TYPES[i.type];
                        if (t.cap) zoneCapacities[i.zoneId] += t.cap;
                        if (i.type === 'DATA_CENTER') dcCount++;
                    });

                    currentState.contracts.forEach(c => {
                        const cCell = currentState.mapData.find(m => m.x === c.x && m.y === c.y);
                        if (cCell) newLoads[cCell.zoneId] += 250; 
                    });

                    let pingAcc = 15 - (dcCount * 2);
                    if (pingAcc < 2) pingAcc = 2;
                    
                    for (let z in newLoads) {
                        let cap = zoneCapacities[z];
                        if (cap === 0) cap = 1;
                        if (newLoads[z] > cap) {
                            pingAcc += ((newLoads[z] - cap) / cap) * 300;
                            if (newLoads[z] > cap * 1.3 && Math.random() < 0.15) {
                                newLogs.push(addLog(`¡CAÍDA DE SERVICIO en ${ZONES.find(x=>x.id==parseInt(z)).name}! Nodos colapsados.`, 'error'));
                            }
                        }
                    }
                    let currentPing = Math.floor(pingAcc);
                    if (currentPing > 60 && Math.random() < 0.2) newLogs.push(addLog(`¡ALERTA NOC! Ping crítico (${currentPing}ms). Fuga de empresas inminente.`, 'error'));

                    // BGP, Peering & Transit
                    let totalLoad = Object.values(newLoads).reduce((a,b)=>a+b, 0);
                    let peeringOffload = 0;
                    if (currentState.noc.peering.public) peeringOffload += 0.3;
                    if (currentState.noc.peering.cdn) peeringOffload += 0.4;
                    
                    if (currentState.noc.bgp.policy === 'cost') { peeringOffload *= 1.2; currentPing += 15; }
                    else if (currentState.noc.bgp.policy === 'latency') { peeringOffload *= 0.7; currentPing -= 10; }
                    peeringOffload = Math.min(0.9, peeringOffload);
                    
                    let transitTraffic = totalLoad * (1 - peeringOffload);
                    let transitCapacity = currentState.noc.transit.ports * 10000;
                    
                    if (transitTraffic > transitCapacity) {
                        currentPing += ((transitTraffic - transitCapacity) / transitCapacity) * 200;
                        if (Math.random() < 0.2 && !currentState.isSpectator) newLogs.push(addLog('¡Saturación de Tránsito IP (Tráfico dropeado por Tier-1)!', 'error'));
                    }
                    
                    fin.varCosts += (currentState.noc.transit.ports * 25000); // 25k monthly per Tier-1 port
                    const transitStats = { totalLoad, peeringOffload, transitTraffic, transitCapacity };

                    currentState.contracts.forEach(c => {
                        const myCov = coverageMap[`${c.x}-${c.y}`];
                        const tier = CONTRACT_TIERS[c.tierId];
                        
                        let satisfiesSLA = false;
                        if (tier.id === 'SLA_9999') satisfiesSLA = (myCov.mobile >= 3 && myCov.fixed >= 3 && currentPing <= 45); 
                        else satisfiesSLA = ((myCov.mobile >= tier.reqTech || myCov.fixed >= tier.reqTech) && currentPing <= 90);

                        if (currentEvent && currentEvent.type === 'ddos' && (currentState.hr.engineers.count * (currentState.hr.engineers.prod / 100)) < 3) {
                            satisfiesSLA = false; // Sin 3 ingenieros, los ataques DDoS tiran los servicios B2B (Multas)
                        }

                        if (satisfiesSLA) {
                            fin.incomeContracts += c.value;
                            if (myCov.fixed >= 3) localFiberB2BClients++; 
                        } else {
                            fin.fines += tier.fine;
                            if (Math.random() < 0.35) {
                                contractsToDrop.push(c.id);
                                newLogs.push(addLog(`SLA INCUMPLIDO: Contrato perdido en [${c.x},${c.y}]. El cliente nos demandó.`, 'error'));
                                const cellIndex = newMapData.findIndex(cell => cell.x === c.x && cell.y === c.y);
                                if (cellIndex > -1) {
                                    let fallbackName = 'Operador Local';
                                    if (currentState.competitors.length > 0) fallbackName = currentState.competitors[Math.floor(Math.random() * currentState.competitors.length)].name;
                                    newMapData[cellIndex].compContract = { compName: fallbackName, price: tier.baseValue * 1.1, tierId: c.tierId };
                                }
                            }
                        }
                    });
                    const activeContracts = currentState.contracts.filter(c => !contractsToDrop.includes(c.id));
                    fiberB2BClients = localFiberB2BClients;

                    if (currentState.itServices.hosting) fin.incomeIT += (IT_SERVICES.hosting.revenuePerB2B * fiberB2BClients);
                    if (currentState.itServices.cdn) fin.incomeIT += (IT_SERVICES.cdn.revenuePerB2B * fiberB2BClients);
                    if (currentState.itServices.cloud) fin.incomeIT += (IT_SERVICES.cloud.revenuePerB2B * fiberB2BClients);

                    fin.incomeFinancial = Math.floor(currentState.corporate.sharesOwned * (currentMarketPrice * 0.008));

                    // Dividendos de adquisiciones 51%+
                    newComps.forEach(comp => {
                        if (comp.sharesOwned >= 51 && comp.sharesOwned < 100) {
                            fin.incomeFinancial += Math.floor((comp.valuation * 0.02) * (comp.sharesOwned / 100)); // 2% yield
                        }
                    });

                    const rentOutDeals = currentState.wholesale.agreements.filter(a => a.type === 'rent_out').length;
                    if (rentOutDeals > 0) {
                        fin.incomeWholesale += (currentState.infra.length * 50 * rentOutDeals);
                    }

                    // 5. Política e IA Competencia
                    const newMuns = currentState.municipalities.map(m => {
                        const playerInfraCount = newInfra.filter(i => i.zoneId === m.id && !i.owner).length;
                        const compInfraCount = newInfra.filter(i => i.zoneId === m.id && i.owner).length;
                        const totalInfra = playerInfraCount + compInfraCount;
                        
                        let currentShare = m.compShare;
                        if (totalInfra > 0) {
                            const targetCompShare = (compInfraCount / totalInfra) * 100;
                            if (currentShare < targetCompShare) currentShare += 1;
                            else if (currentShare > targetCompShare) currentShare -= 0.5;
                        }

                        let res = m.mayorRespect;
                        if (Math.random() > 0.6) res -= 1; 
                        if (m.subsidiaryActive && Math.random() > 0.8) res += 1; 
                        return { ...m, mayorRespect: Math.max(0, Math.min(100, res)), compShare: Math.max(5, Math.min(95, Math.floor(currentShare))) };
                    });

                    // 5.5 Licitaciones y Subsidios
                    let oneTimeGrants = 0;
                    let newTenders = [...(currentState.tenders || [])];
                    
                    if (newTenders.length < 3 && Math.random() < 0.08 && !currentState.isSpectator) {
                        const zId = Math.floor(Math.random() * 4);
                        const rTech = Math.floor(Math.random() * 2) + 2; 
                        const reward = (rTech * 200000) + Math.floor(Math.random() * 200000);
                        newTenders.push({
                            id: 'tnd_' + Date.now() + Math.floor(Math.random()*100),
                            zoneId: zId, targetType: 'house', reqTech: rTech, reqCount: 3 + Math.floor(Math.random() * 4),
                            reward: reward, deadline: 24, status: 'available', currentCount: 0
                        });
                        newLogs.push(addLog(`Nueva licitación gubernamental publicada para el ${ZONES.find(z=>z.id===zId).name}.`, 'info'));
                    }

                    newTenders = newTenders.map(t => {
                        if (t.status === 'active') {
                            t.deadline -= 1;
                            let covered = 0;
                            newMapData.filter(c => c.zoneId === t.zoneId && c.type === t.targetType).forEach(c => {
                                if (coverageMap[c.id].mobile >= t.reqTech || coverageMap[c.id].fixed >= t.reqTech) covered++;
                            });
                            t.currentCount = covered;
                            if (covered >= t.reqCount) {
                                oneTimeGrants += t.reward; t.status = 'completed';
                                newLogs.push(addLog(`¡Licitación completada! Llevaste red a zonas rurales de ${ZONES.find(z=>z.id===t.zoneId).name}. Recompensa: +${formatCur(t.reward)}`, 'success'));
                            } else if (t.deadline <= 0) {
                                fin.legalFines += t.reward * 0.25; t.status = 'failed';
                                newLogs.push(addLog(`Licitación vencida. No cumpliste la meta en ${ZONES.find(z=>z.id===t.zoneId).name}. Multa: ${formatCur(t.reward * 0.25)}`, 'error'));
                            }
                        } else if (t.status === 'available') { t.deadline -= 1; if (t.deadline <= 0) t.status = 'expired'; }
                        return t;
                    }).filter(t => t.status === 'available' || t.status === 'active');
                    fin.incomeGrants = oneTimeGrants;

                    // 6. Eventos y M&A
                    let offerObj = uiState.buyoutOffer;
                    let showModal = uiState.showBuyoutModal;
                    
                    if (currentState.money > 2000000 && Math.random() < 0.02 && !showModal && !currentState.isSpectator) {
                        const offerVal = currentState.money + (fin.incomePlans * 24); 
                        let buyerName = 'Fondo de Inversión Global';
                        if (currentState.competitors.length > 0) {
                            buyerName = currentState.competitors[Math.floor(Math.random() * currentState.competitors.length)].name + ' Group';
                        }
                        offerObj = { buyer: buyerName, amount: offerVal };
                        showModal = true;
                    }

                    fin.salaries = (currentState.hr.technicians.count * currentState.hr.technicians.salary) + (currentState.hr.support.count * currentState.hr.support.salary) + (currentState.hr.engineers.count * currentState.hr.engineers.salary);
                    fin.interest = (currentState.corporate.loan || 0) * 0.03; // 3% interés mensual altísimo por deuda corporativa

                    // Incidentes Legales y Compliance
                    if (currentState.settings.smsAdsEnabled && !currentState.legal.dataProtection && Math.random() < 0.08) {
                        const breachFine = 25000 + (connectedPop * 2);
                        fin.legalFines += breachFine;
                        newLogs.push(addLog(`¡MULTA GUBERNAMENTAL! Violación de privacidad por venta de datos. Sanción: ${formatCur(breachFine)}`, 'error'));
                    }
                    if (currentState.legal.dataProtection) {
                        fin.maint += connectedPop * 0.5; // Costo de cumplimiento legal y servidores seguros
                    }

                    let preTaxNet = (fin.incomePlans + fin.incomeContracts + fin.incomeIT + fin.incomeAds + fin.incomeWholesale + fin.incomeFinancial + fin.incomeSpace + fin.incomeGrants) - (fin.varCosts + fin.costWholesale + fin.rent + fin.power + fin.maint + fin.fines + fin.legalFines + fin.salaries + fin.interest);
                    
                    fin.taxes = preTaxNet > 0 ? preTaxNet * currentState.legal.taxRate : 0;
                    fin.net = preTaxNet - fin.taxes;
                    
                    const newMoney = currentState.money + fin.net;
                    const valuation = newMoney + (fin.net * 12) + (currentState.infra.length * 20000);

                    uiState.buyoutOffer = offerObj;
                    uiState.showBuyoutModal = showModal;

                    return {
                        ...currentState, month: currentState.month + 1, money: newMoney, mapData: newMapData, infra: newInfra, competitors: newComps, municipalities: newMuns, transportAds: activeAds,
                        contracts: activeContracts, finances: { current: fin, planPerformance: planPerf }, noc: { ...currentState.noc, ping: currentPing, loads: newLoads, capacities: zoneCapacities },
                        corporate: { ...currentState.corporate, marketIndexPrice: currentMarketPrice, companyValuation: valuation },
                        satellites: currentState.satellites || [], satelliteContracts: activeSatContracts, satelliteOffers: newSatOffers,
                        logs: [...newLogs, ...currentState.logs].slice(0, 50),
                        activeEvent: currentEvent,
                        gameOver: newMoney < -5000000 // Margen subido a -5M por permitir deudas
                    };
                }
                default: return currentState;
            }
        }

        const formatCur = (num) => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(num);
        const icon = (name, size = 20, className = '') => `<i data-lucide="${name}" class="${className}" style="width: ${size}px; height: ${size}px; display: inline-block;"></i>`;

        const calcNewPlanCost = () => {
            let cost = 0;
            if (uiState.newPlan.type === 'mobile' || uiState.newPlan.type === 'convergent') {
                if (uiState.newPlan.sVoice) cost += SERVICE_COSTS.voice;
                if (uiState.newPlan.sSms) cost += SERVICE_COSTS.sms;
                if (uiState.newPlan.sData) cost += SERVICE_COSTS.data;
                if (uiState.newPlan.sRoaming) cost += SERVICE_COSTS.roaming;
            } 
            if (uiState.newPlan.type === 'fixed' || uiState.newPlan.type === 'convergent') {
                if (uiState.newPlan.sInt) cost += SERVICE_COSTS.internet;
            }
            if (uiState.newPlan.sTv) cost += SERVICE_COSTS.tv;
            if (uiState.newPlan.sStream) cost += SERVICE_COSTS.streaming;
            if (uiState.newPlan.sSatInt) cost += SERVICE_COSTS.sat_internet;
            if (uiState.newPlan.sSatTv) cost += SERVICE_COSTS.sat_tv;
            return cost;
        };

        // --- MANEJADORES GLOBALES ---
        window.dispatch = (action) => { 
            const prevLogsLength = state.logs.length;
            state = gameReducer(state, action); 
            
            if (state.logs.length > prevLogsLength) {
                const newLog = state.logs[0];
                if (newLog.type !== 'info') {
                    uiState.notification = newLog;
                    if (window.toastTimer) clearTimeout(window.toastTimer);
                    window.toastTimer = setTimeout(() => { uiState.notification = null; renderApp(); }, 4000);
                }
            }
            renderApp(); 
        };
        window.setUiState = (key, val) => { uiState[key] = val; renderApp(); };
        window.handleZoom = (inOut) => { uiState.zoom = Math.max(0.4, Math.min(2.5, uiState.zoom + (inOut === 'in' ? 0.2 : -0.2))); renderApp(); };

        window.handleCellClick = (x, y) => {
            const cellData = state.mapData.find(c => c.x === x && c.y === y);
            const infraData = state.infra.find(i => i.x === x && i.y === y);
            const zoneData = state.municipalities.find(z => z.id === cellData.zoneId);
            const contract = state.contracts.find(c => c.x === x && c.y === y);
            uiState.selectedCell = { ...cellData, infra: infraData, zoneData, contract, isCompInfra: infraData?.owner ? true : false };

            if (uiState.selectedTool && !state.isSpectator) {
                if (uiState.selectedTool === 'DEMOLISH') dispatch({ type: 'REMOVE_INFRA', payload: { x, y } });
                else dispatch({ type: 'BUILD_INFRA', payload: { x, y, infraType: uiState.selectedTool } });
                uiState.selectedTool = null;
            } else {
                if (window.innerWidth < 1024) { uiState.activeTab = 'inspector'; uiState.mobileView = 'panel'; }
                renderApp();
            }
        };

        window.selectTool = (key) => { uiState.selectedTool = uiState.selectedTool === key ? null : key; uiState.mobileView = 'map'; renderApp(); };
        
        // Función silenciosa para evitar parpadeos de teclado
        window.updatePlanFormSilent = (key, val) => { uiState.newPlan[key] = val; };
        window.updateContractFormSilent = (key, val) => { uiState.contractForm[key] = val; };
        
        window.updatePlanFormCheckbox = (key, val) => { uiState.newPlan[key] = !uiState.newPlan[key]; renderApp(); };
        window.updatePlanFormSelect = (key, val) => { uiState.newPlan[key] = val; renderApp(); };
        window.updateContractFormSelect = (key, val) => { 
            uiState.contractForm[key] = val; 
            if (key === 'tierId') uiState.contractForm.askingPrice = CONTRACT_TIERS[val].baseValue;
            renderApp(); 
        };

        window.handleAddPlan = (e) => {
            e.preventDefault();
            if (uiState.newPlan.name && !state.isSpectator) {
                const services = {};
                if (uiState.newPlan.type === 'mobile' || uiState.newPlan.type === 'convergent') {
                    services.voice = uiState.newPlan.sVoice; services.sms = uiState.newPlan.sSms;
                    services.data = uiState.newPlan.sData; services.roaming = uiState.newPlan.sRoaming;
                }
                if (uiState.newPlan.type === 'fixed' || uiState.newPlan.type === 'convergent') {
                    services.internet = uiState.newPlan.sInt;
                }
                services.tv = uiState.newPlan.sTv; services.streaming = uiState.newPlan.sStream;
                services.sat_internet = uiState.newPlan.sSatInt; services.sat_tv = uiState.newPlan.sSatTv;
                
                dispatch({ type: 'ADD_PLAN', payload: { id: 'p_' + Date.now(), name: uiState.newPlan.name, type: uiState.newPlan.type, zoneId: uiState.newPlan.zoneId, price: Number(uiState.newPlan.price), minTech: Number(uiState.newPlan.minTech), services } });
                uiState.newPlan = {...uiState.newPlan, name: ''}; 
            }
        };

        window.handleMouseEnter = (x, y, event) => {
            const cellData = state.mapData.find(c => c.x === x && c.y === y);
            const infra = state.infra.find(i => i.x === x && i.y === y);
            const contract = state.contracts.find(c => c.x === x && c.y === y);
            
            let content = `<div class="font-bold text-slate-200 border-b border-slate-700 pb-1 mb-1">Parcela [${x},${y}]</div>`;
            
            const terrainNames = { plain: 'Llanura', mountain: 'Montaña (x2.5 Coste)', river: 'Río (x1.5 Coste)', sea: 'Mar (x5 Coste)' };
            const wealthNames = { 1: 'Bajo', 2: 'Medio', 3: 'Alto' };
            content += `<div class="text-[10px] text-slate-400 mb-1">Terreno: ${terrainNames[cellData.terrain]}</div>`;
            if (cellData.pop > 0) content += `<div class="text-[10px] text-yellow-400 font-bold mb-1">Poder Adquisitivo: ${wealthNames[cellData.wealth]}</div>`;
            
            if (infra) {
                const t = INFRA_TYPES[infra.type];
                const owner = infra.owner ? getCompetitor(infra.owner) : { name: 'Propia', color: 'text-emerald-400' };
