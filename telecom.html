                                    <button onclick="dispatch({type:'TOGGLE_PAUSE'})" class="p-1 rounded hover:bg-slate-800 ${state.isPaused ? 'text-yellow-400' : 'text-slate-400'}">${state.isPaused ? icon('pause', 12) : icon('play', 12)}</button>
                                    <div class="w-px h-3 bg-slate-700 mx-1"></div>
                                    <button onclick="dispatch({type:'SET_SPEED', payload: 1})" class="px-1.5 text-[9px] font-bold rounded hover:bg-slate-800 ${state.speed === 1 ? 'text-white bg-slate-700' : 'text-slate-500'}">1x</button>
                                    <button onclick="dispatch({type:'SET_SPEED', payload: 2})" class="px-1.5 text-[9px] font-bold rounded hover:bg-slate-800 ${state.speed === 2 ? 'text-white bg-slate-700' : 'text-slate-500'}">2x</button>
                                    <button onclick="dispatch({type:'SET_SPEED', payload: 10})" class="px-1.5 text-[9px] font-bold rounded hover:bg-slate-800 ${state.speed === 10 ? 'text-white bg-slate-700' : 'text-slate-500'}">10x</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-4 sm:gap-6 text-right items-center">
                        ${state.isSpectator ? `<div class="bg-emerald-900/30 border border-emerald-500/30 px-3 py-1 rounded hidden md:block"><p class="text-[10px] text-emerald-400 font-bold uppercase">Modo Inversor</p></div>` : ''}
                        <div class="flex flex-col items-end hidden sm:flex border-r border-slate-700 pr-4 mr-2">
                            <p class="text-[9px] sm:text-[10px] text-slate-500 uppercase font-bold tracking-wider">Ping</p>
                            <p class="font-mono text-base sm:text-xl font-black ${state.noc.ping < 45 ? 'text-emerald-400' : state.noc.ping < 90 ? 'text-yellow-400' : 'text-red-500'}">${state.noc.ping} ms</p>
                        </div>
                        <div class="flex flex-col items-end">
                            <p class="text-[9px] sm:text-[10px] text-slate-500 uppercase font-bold tracking-wider">${state.isSpectator?'Banco Personal':'Caja Corp.'}</p>
                            <p class="font-mono text-base sm:text-xl font-black text-emerald-400">${formatCur(state.money)}</p>
                        </div>
                        <div class="flex flex-col items-end">
                            <p class="text-[9px] sm:text-[10px] text-slate-500 uppercase font-bold tracking-wider">EBITDA</p>
                            <p class="font-mono text-sm sm:text-lg font-bold flex items-center gap-1 ${state.finances.current.net >= 0 ? 'text-emerald-500' : 'text-red-500'}">
                                ${state.finances.current.net >= 0 ? icon('trending-up', 14) : icon('trending-down', 14)}
                                ${formatCur(Math.abs(state.finances.current.net))}
                            </p>
                        </div>
                    </div>
                    <button onclick="setUiState('mobileView', uiState.mobileView === 'map' ? 'panel' : 'map')" class="lg:hidden p-2 bg-slate-800 rounded-lg text-slate-300 z-50">
                        ${uiState.mobileView === 'map' ? icon('menu', 24) : icon('map', 24)}
                    </button>
                </header>

                <div class="flex flex-1 overflow-hidden relative">
                    <!-- PANEL MAPA -->
                    <div class="flex-1 bg-slate-950 relative overflow-hidden flex justify-center items-center border-r border-slate-800 transition-all ${uiState.mobileView === 'map' ? 'block' : 'hidden lg:flex'}">
                        
                        <div class="absolute top-4 left-4 z-30 flex flex-col gap-2">
                            <div class="bg-slate-900/90 border border-slate-700 rounded-xl p-2 shadow-lg backdrop-blur-sm">
                                <p class="text-[9px] text-slate-500 uppercase font-bold mb-2 ml-1">Capas de Mapa</p>
                                <button onclick="setUiState('showCoverageMode', uiState.showCoverageMode === 'mobile' ? null : 'mobile')" class="w-full text-left px-3 py-2 rounded-lg text-[10px] font-bold flex items-center gap-2 transition-all mb-1 ${uiState.showCoverageMode === 'mobile' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 text-slate-300'}">${icon('smartphone', 14)} Cobertura Móvil</button>
                                <button onclick="setUiState('showCoverageMode', uiState.showCoverageMode === 'fixed' ? null : 'fixed')" class="w-full text-left px-3 py-2 rounded-lg text-[10px] font-bold flex items-center gap-2 transition-all mb-1 ${uiState.showCoverageMode === 'fixed' ? 'bg-emerald-600 text-white' : 'hover:bg-slate-800 text-slate-300'}">${icon('router', 14)} Cobertura Fija</button>
                                <div class="h-px bg-slate-700 my-1"></div>
                                <p class="text-[9px] text-slate-500 uppercase font-bold mb-1 ml-1 mt-2">Competencia</p>
                                ${state.competitors.map(c => `
                                    <button onclick="setUiState('showCoverageMode', uiState.showCoverageMode === 'comp_${c.id}' ? null : 'comp_${c.id}')" class="w-full text-left px-3 py-1.5 rounded-lg text-[10px] font-bold flex items-center gap-2 transition-all ${uiState.showCoverageMode === 'comp_'+c.id ? 'bg-red-600 text-white' : 'hover:bg-slate-800 text-slate-400'}">
                                        <div class="w-2 h-2 rounded-full ${c.bg}"></div> ${c.name}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <div class="absolute bottom-4 right-4 z-30 flex flex-col gap-1 bg-slate-900/90 p-1.5 rounded-xl border border-slate-700 backdrop-blur-md shadow-2xl">
                            <button onclick="handleZoom('in')" class="p-2.5 hover:bg-slate-700 rounded-lg text-slate-300 transition-colors">${icon('zoom-in', 20)}</button>
                            <div class="h-px bg-slate-700 w-full mx-auto" style="width: 80%"></div>
                            <button onclick="handleZoom('out')" class="p-2.5 hover:bg-slate-700 rounded-lg text-slate-300 transition-colors">${icon('zoom-out', 20)}</button>
                        </div>

                        <div id="map-container" class="w-full h-full overflow-auto custom-scrollbar flex items-center justify-center p-8 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
                            <div class="grid gap-[1px] bg-slate-800 p-[2px] shadow-[0_0_50px_rgba(0,0,0,0.8)] transition-transform duration-300 rounded-sm" style="grid-template-columns: repeat(${GRID_SIZE}, 48px); grid-template-rows: repeat(${GRID_SIZE}, 48px); transform: scale(${uiState.zoom}); transform-origin: center center;">
                                ${mapHTML}
                            </div>
                        </div>
                    </div>

                    <!-- PANEL DERECHO -->
                    <div class="w-full lg:w-[480px] bg-slate-900 flex flex-col shrink-0 z-40 transition-all ${uiState.mobileView === 'panel' ? 'block absolute inset-0' : 'hidden lg:flex'}">
                        <div class="flex overflow-x-auto border-b border-slate-800 bg-slate-950 p-2 gap-1.5 shrink-0 custom-scrollbar pb-3">
                            ${renderTabButtons}
                        </div>
                        <div id="sidebar-content" class="p-4 flex-1 overflow-y-auto custom-scrollbar bg-gradient-to-b from-slate-900/50 to-slate-950">
                            ${tabContentHTML}
                        </div>
                    </div>
                </div>
                ${buyoutModalHTML}
                ${uiState.notification ? `
                    <div class="fixed bottom-6 left-0 right-0 flex justify-center z-50 pointer-events-none fade-in-up">
                        <div class="bg-slate-900/95 border ${uiState.notification.type === 'error' ? 'border-red-500 text-red-400' : uiState.notification.type === 'success' ? 'border-emerald-500 text-emerald-400' : 'border-yellow-500 text-yellow-400'} px-6 py-3 rounded-full shadow-2xl backdrop-blur-md flex items-center gap-3">
                            ${icon(uiState.notification.type === 'error' ? 'alert-circle' : uiState.notification.type === 'success' ? 'check-circle' : 'alert-triangle', 20)}
                            <span class="text-xs font-bold">${uiState.notification.msg}</span>
                        </div>
                    </div>
                ` : ''}
            `;

            lucide.createIcons();
            
            const newSidebarEl = document.getElementById('sidebar-content');
            const newMapEl = document.getElementById('map-container');
            if(newSidebarEl) newSidebarEl.scrollTop = sidebarScroll;
            if(newMapEl) { newMapEl.scrollLeft = mapScrollX; newMapEl.scrollTop = mapScrollY; }
        }

        renderApp();
        updateGameLoop();
    </script>
</body>
</html>
